name: Engine checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for file in game.js factions.js models.js terrain.js spatial.js lobby.js audio.js; do node --check "$file"; done
      - run: node --test tests/*.test.cjs
